[project]
name = "clipforge"
version = "0.1.0"
description = "Local-first AI clipping studio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.7.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
    "sse-starlette>=3.4.11",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
clipforge = "clipforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/clipforge"]
dev-mode-dirs = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S"]

[tool.pyright]
include = ["backend", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = ["live: calls real external services (API, network)", "slow: long-running"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
